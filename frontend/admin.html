
<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ImprezaPrint | Admin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6f8;
            color: #171717;
        }

        header {
            background: #111;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        header h1 {
            font-size: 23px;
        }

        header span {
            color: #ff5252;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            font-weight: bold;
        }

        .logout {
            background: #e63946;
            color: white;
        }

        .container {
            width: 94%;
            max-width: 1450px;
            margin: 28px auto;
        }

        .page-heading {
            margin-bottom: 20px;
        }

        .page-heading h2 {
            margin-bottom: 8px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(5, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 9px #0000000a;
            border-left: 4px solid #e63946;
        }

        .stat p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat strong {
            font-size: 27px;
        }

        .panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 9px #0000000a;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }

        .toolbar input {
            width: min(100%, 360px);
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
        }

        .refresh {
            background: #171717;
            color: white;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            text-align: left;
            padding: 13px 11px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
            font-size: 14px;
        }

        th {
            background: #fafafa;
            color: #444;
        }

        .status-select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            max-width: 145px;
        }

        .delete {
            background: #ffe5e5;
            color: #b00020;
        }

        .photo-btn {
            background: #eee;
            color: #222;
        }

        .message {
            padding: 14px;
            border-radius: 6px;
            margin-bottom: 16px;
            display: none;
            overflow-wrap: anywhere;
        }

        .error {
            display: block;
            background: #ffe5e5;
            color: #a00000;
        }

        .success {
            display: block;
            background: #e1f7e7;
            color: #176b32;
        }

        .empty {
            text-align: center;
            padding: 35px;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000dd;
            z-index: 10;
            padding: 25px;
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            max-width: 90vw;
            max-height: 85vh;
            text-align: center;
        }

        .modal img {
            max-width: 100%;
            max-height: 75vh;
            object-fit: contain;
            background: white;
            border-radius: 8px;
        }

        .modal button {
            display: block;
            margin: 0 auto 12px;
            background: white;
        }

        @media (max-width: 900px) {
            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 19px;
            }

            .container {
                width: 96%;
                margin-top: 18px;
            }

            .panel {
                padding: 12px;
            }

            .stats {
                gap: 9px;
            }

            .stat {
                padding: 14px;
            }

            .stat strong {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>Impreza<span>Print</span> Admin</h1>

        <div class="header-actions">
            <span id="adminName">Administratori</span>
            <button class="logout" id="logoutBtn">Dil</button>
        </div>
    </header>

    <main class="container">
        <div class="page-heading">
            <h2>Paneli i porosive 📦</h2>
            <p>Menaxho porositë dhe të dhënat e klientëve.</p>
        </div>

        <div id="message" class="message" role="status"></div>

        <section class="stats">
            <div class="stat">
                <p>Gjithsej porosi</p>
                <strong id="totalOrders">0</strong>
            </div>

            <div class="stat">
                <p>Të reja</p>
                <strong id="newOrders">0</strong>
            </div>

            <div class="stat">
                <p>Në proces</p>
                <strong id="processingOrders">0</strong>
            </div>

            <div class="stat">
                <p>Të dërguara</p>
                <strong id="shippedOrders">0</strong>
            </div>

            <div class="stat">
                <p>Të përfunduara</p>
                <strong id="completedOrders">0</strong>
            </div>
        </section>

        <section class="panel">
            <div class="toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Kërko sipas emrit, telefonit ose produktit..."
                    aria-label="Kërko porosi"
                >

                <button class="refresh" id="refreshBtn">
                    Rifresko porositë ↻
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Klienti</th>
                            <th>Kontakti</th>
                            <th>Adresa</th>
                            <th>Produkti</th>
                            <th>Sasia</th>
                            <th>Totali</th>
                            <th>Pagesa</th>
                            <th>Foto</th>
                            <th>Statusi</th>
                            <th>Veprime</th>
                        </tr>
                    </thead>

                    <tbody id="orders">
                        <tr>
                            <td colspan="11" class="empty">
                                Duke ngarkuar porositë...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="modal" id="imageModal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <button id="closeModal">Mbyll ✕</button>
            <img id="modalImage" src="" alt="Foto e personalizuar e porosisë">
        </div>
    </div>

    <script>
        "use strict";

        const API_URL =
            "https://imprezaprint-production.up.railway.app";

        const adminData = sessionStorage.getItem("imprezaAdmin");

        const ordersBody = document.getElementById("orders");
        const messageBox = document.getElementById("message");
        const searchInput = document.getElementById("searchInput");

        let allOrders = [];

        if (!adminData) {
            window.location.replace("/admin-login.html");
        } else {
            try {
                const admin = JSON.parse(adminData);
                document.getElementById("adminName").textContent =
                    admin.username || "Administratori";
                loadOrders();
            } catch (error) {
                sessionStorage.removeItem("imprezaAdmin");
                window.location.replace("/admin-login.html");
            }
        }

        function showMessage(message, type = "error") {
            messageBox.textContent = message;
            messageBox.className = "message " + type;

            if (type === "success") {
                setTimeout(() => {
                    messageBox.className = "message";
                }, 4000);
            }
        }

        async function apiRequest(url, options = {}) {
            const response = await fetch(API_URL + url, {
                ...options,
                headers: {
                    "Content-Type": "application/json",
                    ...(options.headers || {})
                }
            });

            const text = await response.text();
            let data = {};

            try {
                data = text ? JSON.parse(text) : {};
            } catch {
                throw new Error(
                    "Serveri nuk ktheu JSON. Kontrollo backend-in në Railway."
                );
            }

            if (!response.ok) {
                throw new Error(
                    data.message || "Gabim nga serveri: " + response.status
                );
            }

            return data;
        }

        async function loadOrders() {
            ordersBody.innerHTML =
                '<tr><td colspan="11" class="empty">Duke ngarkuar porositë...</td></tr>';

            try {
                const data = await apiRequest("/api/orders");

                allOrders = Array.isArray(data)
                    ? data
                    : Array.isArray(data.orders)
                        ? data.orders
                        : [];

                updateStats();
                renderOrders();
            } catch (error) {
                ordersBody.innerHTML =
                    '<tr><td colspan="11" class="empty">Nuk u ngarkuan porositë.</td></tr>';

                showMessage(error.message);
            }
        }

        function updateStats() {
            document.getElementById("totalOrders").textContent =
                allOrders.length;

            document.getElementById("newOrders").textContent =
                allOrders.filter(order => isStatus(order, ["E re", "E reja", "New"])).length;

            document.getElementById("processingOrders").textContent =
                allOrders.filter(order => isStatus(order, ["Në proces", "Ne proces", "Processing"])).length;

            document.getElementById("shippedOrders").textContent =
                allOrders.filter(order => isStatus(order, ["E dërguar", "E derguar", "Shipped"])).length;

            document.getElementById("completedOrders").textContent =
                allOrders.filter(order => isStatus(order, ["E përfunduar", "E perfunduar", "Completed"])).length;
        }

        function isStatus(order, values) {
            const status = String(order.status || "E re").toLowerCase();
            return values.some(value => status === value.toLowerCase());
        }

        function renderOrders() {
            const query = searchInput.value.trim().toLowerCase();

            const filtered = allOrders.filter(order => {
                const searchable = [
                    order.id,
                    order.name,
                    order.phone,
                    order.address,
                    order.city,
                    order.product,
                    order.phoneModel
                ].join(" ").toLowerCase();

                return searchable.includes(query);
            });

            if (filtered.length === 0) {
                ordersBody.innerHTML =
                    '<tr><td colspan="11" class="empty">Nuk ka porosi për t’u shfaqur.</td></tr>';
                return;
            }

            ordersBody.replaceChildren();

            filtered.forEach(order => {
                const row = document.createElement("tr");

                addCell(row, "#" + order.id);
                addCell(row, order.name || "—");
                addCell(row, order.phone || "—");

                addCell(
                    row,
                    [order.address, order.city].filter(Boolean).join(", ") || "—"
                );

                addCell(
                    row,
                    [order.product, order.phoneModel]
                        .filter(Boolean)
                        .join(" — ") || "—"
                );

                addCell(row, order.quantity ?? "—");

                const total = Number(
                    order.total ?? Number(order.price || 0) * Number(order.quantity || 1)
                );

                addCell(
                    row,
                    Number.isFinite(total) ? total.toFixed(2) + " €" : "—"
                );

                addCell(row, paymentLabel(order.paymentMethod));

                const photoCell = document.createElement("td");
                if (order.image) {
                    const photoButton = document.createElement("button");
                    photoButton.className = "photo-btn";
                    photoButton.textContent = "Shiko foton";
                    photoButton.addEventListener("click", () => {
                        openImage(order.image);
                    });
                    photoCell.appendChild(photoButton);
                } else {
                    photoCell.textContent = "Pa foto";
                }
                row.appendChild(photoCell);

                const statusCell = document.createElement("td");
                const select = document.createElement("select");
                select.className = "status-select";

                const statuses = [
                    "E re",
                    "Në proces",
                    "E dërguar",
                    "E përfunduar",
                    "Anuluar"
                ];

                const currentStatus = order.status || "E re";

                statuses.forEach(status => {
                    const option = document.createElement("option");
                    option.value = status;
                    option.textContent = status;
                    if (status.toLowerCase() === currentStatus.toLowerCase()) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });

                select.addEventListener("change", () => {
                    changeStatus(order.id, select.value);
                });

                statusCell.appendChild(select);
                row.appendChild(statusCell);

                const actionCell = document.createElement("td");
                const deleteButton = document.createElement("button");
                deleteButton.className = "delete";
                deleteButton.textContent = "Fshij";
                deleteButton.addEventListener("click", () => {
                    deleteOrder(order.id);
                });
                actionCell.appendChild(deleteButton);
                row.appendChild(actionCell);

                ordersBody.appendChild(row);
            });
        }

        function addCell(row, value) {
            const cell = document.createElement("td");
            cell.textContent = value == null ? "—" : String(value);
            row.appendChild(cell);
        }

        function paymentLabel(method) {
            const labels = {
                cash_on_delivery: "Pagesë në dorëzim",
                cash: "Para në dorë",
                bank: "Bankë"
            };

            return labels[method] || method || "—";
        }

        async function changeStatus(id, status) {
            try {
                await apiRequest("/api/orders/" + encodeURIComponent(id) + "/status", {
                    method: "PUT",
                    body: JSON.stringify({ status })
                });

                showMessage("Statusi i porosisë #" + id + " u ndryshua.", "success");
                await loadOrders();
            } catch (error) {
                showMessage("Statusi nuk u ndryshua: " + error.message);
            }
        }

        async function deleteOrder(id) {
            if (!confirm("A je i sigurt që dëshiron ta fshish porosinë #" + id + "?")) {
                return;
            }

            try {
                await apiRequest("/api/orders/" + encodeURIComponent(id), {
                    method: "DELETE"
                });

                showMessage("Porosia #" + id + " u fshi.", "success");
                await loadOrders();
            } catch (error) {
                showMessage("Porosia nuk u fshi: " + error.message);
            }
        }

        function openImage(image) {
            const modal = document.getElementById("imageModal");
            const modalImage = document.getElementById("modalImage");

            modalImage.src = image.startsWith("data:")
                ? image
                : "data:image/jpeg;base64," + image;

            modal.classList.add("open");
        }

        function closeImage() {
            document.getElementById("imageModal").classList.remove("open");
            document.getElementById("modalImage").src = "";
        }

        document.getElementById("closeModal").addEventListener("click", closeImage);

        document.getElementById("imageModal").addEventListener("click", event => {
            if (event.target.id === "imageModal") {
                closeImage();
            }
        });

        document.getElementById("refreshBtn").addEventListener("click", loadOrders);

        searchInput.addEventListener("input", renderOrders);

        document.getElementById("logoutBtn").addEventListener("click", () => {
            sessionStorage.removeItem("imprezaAdmin");
            window.location.href = "/admin-login.html";
        });
    </script>
</body>
</html>
