<script>

const API_URL =
    "https://imprezaprint-production.up.railway.app";


// ===============================
// CHECK ADMIN LOGIN
// ===============================

function checkAdmin() {

    const adminData =
        sessionStorage.getItem("imprezaAdmin");

    if (!adminData) {

        window.location.replace(
            "/admin-login.html"
        );

        return false;
    }

    try {

        const admin =
            JSON.parse(adminData);

        if (
            !admin ||
            admin.username !== "admin"
        ) {

            sessionStorage.removeItem(
                "imprezaAdmin"
            );

            window.location.replace(
                "/admin-login.html"
            );

            return false;
        }

        document.getElementById(
            "adminName"
        ).textContent = admin.username;

        return true;

    } catch (error) {

        console.error(error);

        sessionStorage.removeItem(
            "imprezaAdmin"
        );

        window.location.replace(
            "/admin-login.html"
        );

        return false;
    }
}


// ===============================
// LOAD ORDERS
// ===============================

async function loadOrders() {

    const ordersContainer =
        document.getElementById("orders");

    const errorBox =
        document.getElementById("errorBox");

    errorBox.style.display = "none";

    ordersContainer.innerHTML = `
        <div class="empty">
            Duke ngarkuar porositë...
        </div>
    `;

    try {

        const response =
            await fetch(
                API_URL + "/api/orders",
                {
                    method: "GET",
                    cache: "no-store"
                }
            );

        const raw =
            await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "Serveri ktheu përgjigje jo-JSON."
            );
        }

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Gabim gjatë marrjes së porosive."
            );
        }

        const orders =
            Array.isArray(data)
                ? data
                : data.orders || [];

        console.log(
            "Porositë:",
            orders
        );

        updateStats(orders);

        if (
            !Array.isArray(orders) ||
            orders.length === 0
        ) {

            ordersContainer.innerHTML = `
                <div class="empty">
                    Nuk ka ende porosi.
                </div>
            `;

            return;
        }

        ordersContainer.innerHTML = "";

        orders.forEach(order => {

            const orderElement =
                document.createElement("div");

            orderElement.className =
                "order";

            const image =
                order.image
                    ? `
                        <img
                            class="order-image"
                            src="${order.image}"
                            alt="Foto e porosisë"
                        >
                      `
                    : `
                        <div
                            class="order-image"
                            style="
                                display:flex;
                                align-items:center;
                                justify-content:center;
                                color:#999;
                            "
                        >
                            Pa foto
                        </div>
                      `;

            orderElement.innerHTML = `

                <div class="order-top">

                    <div class="order-id">
                        Porosia #${order.id}
                    </div>

                    <div class="order-date">
                        ${formatDate(
                            order.created_at
                        )}
                    </div>

                </div>


                <div class="order-content">

                    <div>
                        ${image}
                    </div>


                    <div>

                        <div class="details">

                            <div class="detail">
                                <strong>Produkti</strong>
                                <span>
                                    ${escapeHtml(
                                        order.product
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Modeli</strong>
                                <span>
                                    ${escapeHtml(
                                        order.phoneModel ||
                                        "-"
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Sasia</strong>
                                <span>
                                    ${order.quantity}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Emri</strong>
                                <span>
                                    ${escapeHtml(
                                        order.name
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Telefoni</strong>
                                <span>
                                    ${escapeHtml(
                                        order.phone
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Adresa</strong>
                                <span>
                                    ${escapeHtml(
                                        order.address
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Qyteti</strong>
                                <span>
                                    ${escapeHtml(
                                        order.city
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Pagesa</strong>
                                <span>
                                    ${escapeHtml(
                                        order.paymentMethod ||
                                        "-"
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Teksti</strong>
                                <span>
                                    ${escapeHtml(
                                        order.text ||
                                        "-"
                                    )}
                                </span>
                            </div>


                            <div class="detail">
                                <strong>Totali</strong>
                                <span class="price">
                                    €${Number(
                                        order.total ??
                                        order.price ??
                                        0
                                    ).toFixed(2)}
                                </span>
                            </div>

                        </div>


                        <div class="actions">

                            <select
                                onchange="
                                    changeStatus(
                                        ${order.id},
                                        this.value
                                    )
                                "
                            >

                                <option
                                    value="E re"
                                    ${
                                        order.status ===
                                        "E re"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    E re
                                </option>


                                <option
                                    value="Në përpunim"
                                    ${
                                        order.status ===
                                        "Në përpunim"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Në përpunim
                                </option>


                                <option
                                    value="Gati"
                                    ${
                                        order.status ===
                                        "Gati"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Gati
                                </option>


                                <option
                                    value="Dërguar"
                                    ${
                                        order.status ===
                                        "Dërguar"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Dërguar
                                </option>


                                <option
                                    value="Përfunduar"
                                    ${
                                        order.status ===
                                        "Përfunduar"
                                            ? "selected"
                                            : ""
                                    }
                                >
                                    Përfunduar
                                </option>

                            </select>


                            <button
                                class="delete"
                                onclick="
                                    deleteOrder(
                                        ${order.id}
                                    )
                                "
                            >
                                Fshi
                            </button>

                        </div>

                    </div>

                </div>
            `;

            ordersContainer.appendChild(
                orderElement
            );

        });

    } catch (error) {

        console.error(
            "Gabim orders:",
            error
        );

        ordersContainer.innerHTML = "";

        errorBox.textContent =
            "Nuk mund të ngarkohen porositë.";

        errorBox.style.display =
            "block";
    }
}


// ===============================
// UPDATE STATS
// ===============================

function updateStats(orders) {

    const total =
        orders.length;


    const newOrders =
        orders.filter(
            order =>
                order.status === "E re"
        ).length;


    const processing =
        orders.filter(
            order =>
                order.status === "Në përpunim"
        ).length;


    const shipped =
        orders.filter(
            order =>
                order.status === "Dërguar"
        ).length;


    const completed =
        orders.filter(
            order =>
                order.status === "Përfunduar"
        ).length;


    const sales =
        orders.reduce(
            (sum, order) =>
                sum +
                Number(
                    order.total ??
                    order.price ??
                    0
                ),
            0
        );


    document.getElementById(
        "totalOrders"
    ).textContent = total;


    document.getElementById(
        "newOrders"
    ).textContent = newOrders;


    document.getElementById(
        "processingOrders"
    ).textContent = processing;


    document.getElementById(
        "shippedOrders"
    ).textContent = shipped;


    document.getElementById(
        "completedOrders"
    ).textContent = completed;


    document.getElementById(
        "totalSales"
    ).textContent =
        "€" + sales.toFixed(2);
}


// ===============================
// CHANGE STATUS
// ===============================

async function changeStatus(
    orderId,
    status
) {

    try {

        const response =
            await fetch(
                API_URL +
                `/api/orders/${orderId}/status`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        status: status
                    })
                }
            );


        const raw =
            await response.text();

        let data = {};

        try {
            data = JSON.parse(raw);
        } catch {}


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Statusi nuk u ndryshua."
            );
        }


        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Gabim: " +
            error.message
        );
    }
}


// ===============================
// DELETE ORDER
// ===============================

async function deleteOrder(
    orderId
) {

    const confirmDelete =
        confirm(
            "A je i sigurt që dëshiron ta fshish këtë porosi?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                API_URL +
                `/api/orders/${orderId}`,
                {
                    method: "DELETE"
                }
            );


        const raw =
            await response.text();

        let data = {};

        try {
            data = JSON.parse(raw);
        } catch {}


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Porosia nuk u fshi."
            );
        }


        await loadOrders();

    } catch (error) {

        console.error(error);

        alert(
            "Gabim: " +
            error.message
        );
    }
}


// ===============================
// LOGOUT
// ===============================

function logout() {

    sessionStorage.removeItem(
        "imprezaAdmin"
    );

    window.location.replace(
        "/admin-login.html"
    );
}


// ===============================
// DATE
// ===============================

function formatDate(date) {

    if (!date) {
        return "-";
    }

    return new Date(date).toLocaleString(
        "sq-AL",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


// ===============================
// SECURITY
// ===============================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


// ===============================
// START
// ===============================

if (checkAdmin()) {
    loadOrders();
}

</script>
