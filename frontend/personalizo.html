<!DOCTYPE html>
<html lang="sq">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ImprezaPrint | Personalizo</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        header {
            width: 100%;
            background: #fff;
            padding: 15px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo img {
            width: auto;
            height: 58px;
            max-width: 180px;
            object-fit: contain;
            display: block;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: #111;
            text-decoration: none;
            font-weight: 600;
        }

        nav a:hover {
            color: #777;
        }

        main {
            max-width: 900px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .box {
            background: #fff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.07);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .product-info {
            background: #f4f4f4;
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .product-info div {
            padding: 7px 0;
        }

        .product-name {
            font-size: 22px;
            font-weight: bold;
        }

        .product-price {
            font-size: 20px;
            font-weight: bold;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: #fff;
            outline: none;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: #111;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .upload-box {
            border: 2px dashed #ccc;
            border-radius: 14px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-box:hover {
            border-color: #111;
        }

        .upload-box input {
            display: none;
        }

        .upload-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .upload-text {
            color: #777;
        }

        #preview {
            max-width: 250px;
            max-height: 250px;
            object-fit: contain;
            display: none;
            margin: 20px auto 0;
            border-radius: 12px;
        }

        .quantity-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .quantity-box button {
            width: 45px;
            height: 45px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .quantity-box input {
            width: 80px;
            text-align: center;
        }

        .total {
            background: #111;
            color: white;
            padding: 18px;
            border-radius: 12px;
            margin: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .continue-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .continue-btn:hover {
            background: #333;
        }

        .error {
            color: #c00000;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            color: #777;
        }

        @media (max-width: 700px) {

            header {
                flex-direction: column;
                gap: 12px;
                padding: 14px 5%;
            }

            nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                margin: 25px auto;
                padding: 0 12px;
            }

            .box {
                padding: 22px;
            }

            h1 {
                font-size: 27px;
            }

            .total {
                font-size: 18px;
            }

        }

    </style>

</head>

<body>


<header>

    <a href="index.html" class="logo">

        <img
            src="UIHN9939.PNG"
            alt="ImprezaPrint"
        >

    </a>


    <nav>

        <a href="index.html">
            Ballina
        </a>

        <a href="index.html#products">
            Produktet
        </a>

        <a href="personalizo.html">
            Personalizo
        </a>

    </nav>

</header>


<main>

    <div class="box">

        <h1>
            Personalizo produktin 🎨
        </h1>

        <p class="subtitle">
            Shto foton, tekstin dhe zgjidh sasinë e produktit.
        </p>


        <div class="product-info">

            <div>
                <span>Produkti:</span>

                <span
                    class="product-name"
                    id="productName"
                >
                    -
                </span>
            </div>


            <div id="modelRow">

                <strong>Modeli:</strong>

                <span id="phoneModel">
                    -
                </span>

            </div>


            <div id="productionInfoRow" style="margin-top:10px">
                <span>Prodhimi:</span>
                <span id="productionInfo">Punim me sublimim</span>
            </div>

            <div>

                <span>Çmimi:</span>

                <span
                    class="product-price"
                    id="productPrice"
                >
                    €0.00
                </span>

            </div>

        </div>


        <div class="field">

            <label for="phoneModelSelect">
                Modeli i telefonit
            </label>

            <select id="phoneModelSelect">

                <option value="">
                    Zgjidh modelin
                </option>

                <option value="iPhone X">
                    iPhone X
                </option>

                <option value="iPhone XS">
                    iPhone XS
                </option>

                <option value="iPhone XS Max">
                    iPhone XS Max
                </option>

                <option value="iPhone XR">
                    iPhone XR
                </option>

                <option value="iPhone 11">
                    iPhone 11
                </option>

                <option value="iPhone 11 Pro">
                    iPhone 11 Pro
                </option>

                <option value="iPhone 11 Pro Max">
                    iPhone 11 Pro Max
                </option>

                <option value="iPhone 12">
                    iPhone 12
                </option>

                <option value="iPhone 12 Pro">
                    iPhone 12 Pro
                </option>

                <option value="iPhone 12 Pro Max">
                    iPhone 12 Pro Max
                </option>

                <option value="iPhone 13">
                    iPhone 13
                </option>

                <option value="iPhone 13 Pro">
                    iPhone 13 Pro
                </option>

                <option value="iPhone 13 Pro Max">
                    iPhone 13 Pro Max
                </option>

                <option value="iPhone 14">
                    iPhone 14
                </option>

                <option value="iPhone 14 Plus">
                    iPhone 14 Plus
                </option>

                <option value="iPhone 14 Pro">
                    iPhone 14 Pro
                </option>

                <option value="iPhone 14 Pro Max">
                    iPhone 14 Pro Max
                </option>

                <option value="iPhone 15">
                    iPhone 15
                </option>

                <option value="iPhone 15 Plus">
                    iPhone 15 Plus
                </option>

                <option value="iPhone 15 Pro">
                    iPhone 15 Pro
                </option>

                <option value="iPhone 15 Pro Max">
                    iPhone 15 Pro Max
                </option>

                <option value="iPhone 16">
                    iPhone 16
                </option>

                <option value="iPhone 16 Plus">
                    iPhone 16 Plus
                </option>

                <option value="iPhone 16 Pro">
                    iPhone 16 Pro
                </option>

                <option value="iPhone 16 Pro Max">
                    iPhone 16 Pro Max
                </option>

                <option value="iPhone 17">
                    iPhone 17
                </option>

                <option value="iPhone 17 Air">
                    iPhone 17 Air
                </option>

                <option value="iPhone 17 Pro">
                    iPhone 17 Pro
                </option>

                <option value="iPhone 17 Pro Max">
                    iPhone 17 Pro Max
                </option>

                <option value="Samsung">
                    Samsung
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                Sasia
            </label>

            <div class="quantity-box">

                <button
                    type="button"
                    id="minus"
                >
                    −
                </button>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1"
                    max="50"
                >

                <button
                    type="button"
                    id="plus"
                >
                    +
                </button>

            </div>

        </div>


        <div class="field">

            <label>
                Fotoja
            </label>

            <label class="upload-box">

                <input
                    type="file"
                    id="imageInput"
                    accept="image/*"
                >

                    📷 Zgjidh foton
                </div>

                    Kliko këtu për të ngarkuar foton

        <div class="field">

                Teksti për personalizim
            </label>

                id="customText"
                placeholder="Shkruaj emrin, tekstin ose dëshirën tënde..."
            ></textarea>

        <div class="total">

            </span>

            Vazhdo te Porosia 📦
        </button>

            id="error"
        ></div>

    </div>

</main>


<footer>

    © 2026 ImprezaPrint — Të gjitha të drejtat e rezervuara.

</footer>


<script>

    /*
        MERR PRODUKTIN NGA INDEX.HTML
    */

    let product =
        "Case";

    let price =
        10;

    let currentModel =
        "";

    let imageData =
        null;


    try {

        const saved =
            localStorage.getItem(
                "imprezaCart"
            );

        if (saved) {

            const data =
                JSON.parse(saved);

            if (data.product) {
                product =
                    data.product;
            }

            if (
                data.price !== undefined
            ) {
                price =
                    Number(data.price);
            }

            if (data.phoneModel) {

                currentModel =
                    data.phoneModel;

            }

        }

    } catch (error) {

        console.error(
            "Gabim:",
            error
        );

    }


    const productName =
        document.getElementById(
            "productName"
        );

    const productPrice =
        document.getElementById(
            "productPrice"
        );

    const totalPrice =
        document.getElementById(
            "totalPrice"
        );

    const quantityInput =
        document.getElementById(
            "quantity"
        );

    const imageInput =
        document.getElementById(
            "imageInput"
        );

    const preview =
        document.getElementById(
            "preview"
        );

    const customText =
        document.getElementById(
            "customText"
        );

    const errorBox =
        document.getElementById(
            "error"
        );

    const modelSelect =
        document.getElementById(
            "phoneModelSelect"
        );


    /*
        SHFAQ PRODUKTIN
    */

    productName.textContent =
        product;

    const isPhoneCase = /^Case\b/i.test(product);

    function getCasePrice(model) {
        const match = String(model || "").match(/iPhone\s*(\d+)/i);
        if (!match) return 10;
        const generation = Number(match[1]);
        if (generation >= 15 && generation <= 17) return 13;
        if (generation >= 13 && generation <= 14) return 11;
        return 10;
    }

    if (isPhoneCase && currentModel) {
        price = getCasePrice(currentModel);
    }

    productPrice.textContent =
        "€" + price.toFixed(2);
    const phoneModelField = modelSelect.closest(".field");
    const phoneModelRow = document.getElementById("modelRow");
    if (phoneModelField) phoneModelField.style.display = isPhoneCase ? "block" : "none";
    if (phoneModelRow) phoneModelRow.style.display = isPhoneCase ? "block" : "none";

    const productionInfo = document.getElementById("productionInfo");
    if (productionInfo) {
        productionInfo.textContent = /maicë me logo|duks me logo/i.test(product)
            ? "Punim me folie transferuese"
            : "Punim me sublimim";
    }


    /*
        MODEL
    */

    if (currentModel) {

        document.getElementById(
            "phoneModel"
        ).textContent =
            currentModel;

        modelSelect.value =
            currentModel;

    }


    /*
        TOTALI
    */

    function updateTotal() {

        let quantity =
            Number(
                quantityInput.value
            );

        if (
            !Number.isFinite(quantity) ||
            quantity < 1
        ) {

            quantity = 1;

            quantityInput.value =
                1;
        }

        if (quantity > 50) {

            quantity = 50;

            quantityInput.value =
                50;
        }

        const total =
            price * quantity;

        totalPrice.textContent =
            "€" + total.toFixed(2);
    }


    updateTotal();


    /*
        MINUS
    */

    document
        .getElementById("minus")
        .addEventListener(
            "click",
            function() {

                let value =
                    Number(
                        quantityInput.value
                    ) || 1;

                if (value > 1) {

                    value--;

                    quantityInput.value =
                        value;

                    updateTotal();
                }

            }
        );


    /*
        PLUS
    */

    document
        .getElementById("plus")
        .addEventListener(
            "click",
            function() {

                let value =
                    Number(
                        quantityInput.value
                    ) || 1;

                if (value < 50) {

                    value++;

                    quantityInput.value =
                        value;

                    updateTotal();
                }

            }
        );


    quantityInput.addEventListener(
        "input",
        updateTotal
    );


    /*
        MODEL CHANGE
    */

    modelSelect.addEventListener(
        "change",
        function() {

            currentModel =
                this.value;

            document.getElementById(
                "phoneModel"
            ).textContent =
                currentModel || "-";

            if (isPhoneCase && currentModel) {
                price = getCasePrice(currentModel);
                productPrice.textContent = "€" + price.toFixed(2);
                updateTotal();
            }

        }
    );


    /*
        FOTO
    */

    imageInput.addEventListener(
        "change",
        function() {

            const file =
                this.files[0];

            if (!file) {
                return;
            }


            if (
                !file.type.startsWith(
                    "image/"
                )
            ) {

                errorBox.textContent =
                    "❌ Zgjidh një foto të vlefshme.";

                errorBox.style.display =
                    "block";

                return;
            }


            const reader =
                new FileReader();


            reader.onload =
                function(event) {

                    imageData =
                        event.target.result;

                    preview.src =
                        imageData;

                    preview.style.display =
                        "block";

                    errorBox.style.display =
                        "none";

                };


            reader.readAsDataURL(file);

        }
    );


    /*
        KOMPRESO FOTON
    */

    function compressImage(
        dataUrl,
        maxWidth = 1200,
        quality = 0.7
    ) {

        return new Promise(
            function(resolve) {

                if (!dataUrl) {

                    resolve(null);

                    return;
                }


                const img =
                    new Image();


                img.onload =
                    function() {

                        let width =
                            img.width;

                        let height =
                            img.height;


                        if (
                            width >
                            maxWidth
                        ) {

                            height =
                                Math.round(
                                    height *
                                    maxWidth /
                                    width
                                );

                            width =
                                maxWidth;
                        }


                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            width;

                        canvas.height =
                            height;


                        const ctx =
                            canvas.getContext(
                                "2d"
                            );


                        ctx.drawImage(
                            img,
                            0,
                            0,
                            width,
                            height
                        );


                        resolve(
                            canvas.toDataURL(
                                "image/jpeg",
                                quality
                            )
                        );

                    };


                img.onerror =
                    function() {

                        resolve(
                            dataUrl
                        );

                    };


                img.src =
                    dataUrl;

            }
        );

    }


    /*
        VAZHDO TE CHECKOUT
    */

    document
        .getElementById("continueBtn")
        .addEventListener(
            "click",
            async function() {

                errorBox.style.display =
                    "none";


                const quantity =
                    Number(
                        quantityInput.value
                    ) || 1;


                if (
                    /^Case\b/i.test(product) &&
                    !currentModel
                ) {

                    errorBox.textContent =
                        "❌ Zgjidh modelin e telefonit.";

                    errorBox.style.display =
                        "block";

                    return;
                }


                let finalImage =
                    imageData;


                if (finalImage) {

                    finalImage =
                        await compressImage(
                            finalImage
                        );

                }


                const total =
                    price * quantity;


                const cart = {

                    product:
                        product,

                    phoneModel:
                        currentModel,

                    quantity:
                        quantity,

                    price:
                        price,

                    total:
                        total,

                    text:
                        customText.value.trim(),

                    image:
                        finalImage

                };


                /*
                    RUAJ POROSINË
                */

                localStorage.setItem(
                    "cart",
                    JSON.stringify(cart)
                );

                localStorage.setItem(
                    "imprezaCart",
                    JSON.stringify(cart)
                );


                /*
                    SHKO TE CHECKOUT
                */

                window.location.href =
                    "checkout.html";

            }
        );

</script>

</body>

</html>
